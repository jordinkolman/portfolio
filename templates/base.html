<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Legacy Kernel | Backend SWE{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <!-- Ensure image actually loads if available, otherwise fallback handles design grace -->
            <img src="{{ url_for('static', filename='assets/legacy-kernel-logo.png') }}" alt="Legacy Kernel Logo" class="logo-img" onerror="this.style.display='none'">
            <div style="display: flex; flex-direction: column;">
                <h1 class="site-title" style="line-height: 1;">Jordin Kolman</h1>
                <span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-color); opacity: 0.8;">LEGACY_KERNEL</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('projects') }}">Projects</a>
            <a href="{{ url_for('blog') }}">Blog</a>
            <a href="{{ url_for('resume') }}">Resume</a>
        </nav>
    </header>
    
    <main class="container fade-in">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Legacy Kernel | Built with structured intent.</p>
    </footer>
</body>
</html>
